name: WorkforceOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: workforceos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: WorkforceOS tests
        run: npm test
      - name: Production build
        run: npm run build
